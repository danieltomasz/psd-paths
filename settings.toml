[paths]
project_root = "/Users/daniel/PhD/Projects/psd-paths"
# Path to BIDS-formatted data (where load_data looks for EEG files)
bids_root = "data/bids"  # Relative to project_root

path_raw_bids = "/Users/daniel/PhD/Projects/psd-path/data/bids/"

# Each run has its own folder with its processed data and outputs, so it can
# be archived, shared or deleted in one piece. For a new run, change the folder
# name in both lines (e.g. runs/v0.3/...). Earlier runs are not touched.
# Results from before v0.2 are in data/derrivatives and outputs/.
derivatives_root = "runs/v0.3.0-dev/derivatives"
outputs_root     = "runs/v0.3.0-dev/outputs"

# Derivative layout. Templates may use {derivatives}, {outputs} and {subject}
# ({subject} expands to e.g. "sub-105").
# Stage-first (stage/subject) groups every subject of one stage together, so a
# single stage folder can be handed to a collaborator on its own.
# Omit a key to keep its default (subject-first: {derivatives}/{subject}/<stage>).
[paths.stages]
preprocessed = "{derivatives}/processed/{subject}"
epochs       = "{derivatives}/epochs/{subject}"
analysis     = "{derivatives}/analysis/{subject}"
ica          = "{derivatives}/ica/{subject}"
figures      = "{outputs}/figures/{subject}"
reports      = "{outputs}/reports/{subject}"
specparam    = "{outputs}/specparam/{subject}"

[pipeline]
# Files written by the runner: executed notebooks, run logs, step status.
# The analysis data itself is in [paths.stages] above.
# {outputs} is outputs_root, so these move with it.
output_root = "{outputs}/pipeline"
output_log =  "{outputs}/log"
status_file = "{outputs}/pipeline_status.json"

# Parallelism and Jupyter kernel
n_jobs = 8
kernel_name = "psd-paths-3.13"

[experiment]
# Add any experiment-specific settings here
task = "RESTING"   # BIDS task label, must match the file names (sub-XXX_ses-01_task-RESTING_eeg)
session = "01"      # BIDS ses-XX level; all 38 subjects use ses-01



[preprocessing]
montage = "GSN-HydroCel-256"

# Bad-channel detection. RANSAC (pyprep) predicts each channel from its
# neighbours, so a cluster of neighbouring bad electrodes can be missed; this is
# how the E221-E223 cluster in sub-109 went undetected. LOF compares channels by
# their activity and does not have this problem.
# Kumaravel et al. 2022, Sensors 22:7314, doi:10.3390/s22197314
use_lof         = true
lof_n_neighbors = 20
# The MNE default of 1.5 flags a median of 11 extra channels per subject here
# (max 47), too many. At 4.0 the median is 1 extra channel (20 of 38 subjects
# affected, max 7), and the sub-109 cluster (scores 10-26) is still detected.
lof_threshold   = 4.0
flat_uv         = 1.0    # channels with a lower std (uV) are flat; LOF does not detect these
channels_to_remove = [
