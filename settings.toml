[cleaning]
# ICA, as passed to compute_ica_limited(). Same number of components for every
# subject (limited by the data rank). Until v0.2.3 the number was the one
# explaining 99% of the variance, capped at 40: 12 of 38 subjects got fewer
# than 40 (as few as 10), because blinks dominate the variance; reducing the
# data this way harms the decomposition (Artoni et al. 2018). 44 is the largest
# number for which every subject has at least 30 unique samples per squared
# component (overlapping epoch parts counted once), the rule HAPPE uses
# (Gabard-Durnam et al. 2018, after Onton & Makeig): 45 meets it in 35/38
# subjects, 50 in 6/38. Step 03 reports subjects below it. Tested on the
# 1-100 Hz data (two seeds): 40 and 50 components give the same specparam fit
# error; 50 removed more of the 30-40 Hz muscle band (-28% vs -16%) with
# slightly lower seed stability (mean share of components matched |r| > 0.95:
# 0.946 vs 0.958; 60: 0.930).
ica_n_components       = 44
ica_random_state       = 97
# Method and fit parameters are set inside compute_ica_limited():
#   method="picard", fit_params=dict(ortho=False, extended=True)

# 04: a manual ICA selection made on an earlier fit is used only if each
# selected component matches a component of the new fit with at least this
# topography correlation.
ica_corr_threshold     = 0.95

# find_bads_ecg() returns every component that correlates with the ECG channel,
# including brain components (sub-107 lost 25% of its alpha power to two of
# them, one with brain p=0.92). ECG hits with an ICLabel class in this list are
# not removed.
ecg_reject_labels = ["brain"]

# ICLabel probability needed to remove a component, per class.
# With 0.80 for all classes, blink components stayed in for 6 of 20 subjects;
# sub-109 kept two eye components (p=0.74 and p=0.54) with 58% of its variance,
# and cleaning removed only 1.5% of its delta power. ICLabel classifies blinks reliably
# below 0.80, so eye blink has a lower threshold. The other classes overlap more
# with brain activity and keep 0.80.
# Muscle: 0.70 since the 1-100 Hz data (ICLabel sees muscle above 40 Hz).
# Tested on the 1-100 Hz data (1 Hz notch) with 40 and 50 components:
# components with muscle p 0.7-0.8 have a muscle-like spectrum (log-log slope
# 7-70 Hz > -0.59, the Fitzgibbon criterion used in RELAX) in 84-93% of cases
# and none has brain p > 0.3; below 0.7 some do (16 components with 40 ICs, 17
# with 50). The specparam fit error is the same at 0.5, 0.7 and 0.8 (50 ICs:
# median MAE 0.0335-0.0338; all subjects within 5% between 0.7 and 0.8);
# removing muscle at all lowers it (none: 0.0351).
[cleaning.ica_label_thresholds]
"eye blink"       = 0.50
"muscle artifact" = 0.70
"heart beat"      = 0.80
"line noise"      = 0.80
"channel noise"   = 0.80


[epochs]
# Epoching. The overlap is 1.5 s. This file used to say 3.0 s, which never
# matched the code; all results were made with 1.5 s.
epoch_length  = 5.0
epoch_overlap = 1.5

# Epoch rejection (autoreject)
autoreject_resample      = 125
autoreject_n_interpolate = [1]
autoreject_consensus     = [0.40]
bad_channel_epoch_threshold = 0.40   # flag a channel bad if bad in >40% of epochs

# Fixed peak-to-peak rejection, used only when autoreject's threshold search
# fails (see the check in get_reject_log).
fallback_ptp_uv       = 150.0
fallback_max_bad_frac = 0.25

[interpolate]
# Step 04 (04_ICA_apply_interpolate) runs autoreject a second time, on the
# ICA-cleaned epochs, with its own settings (previously hardcoded in the
# notebook, values unchanged). They differ from [epochs]: that pass selects the
# epochs for the ICA fit, this one cleans the epochs after ICA.
autoreject_n_interpolate = [1, 2, 4, 8, 32, 64]
autoreject_thresh_method = "bayesian_optimization"
autoreject_random_state  = 100
# If fewer epochs than this are left, step 04 keeps the epochs from before this
# pass and notes it in the report. Added after this pass rejected all epochs of
# sub-114 (caused by a recording pause, see CHANGELOG.md).
min_epochs_after_ar = 10

[group]
# Group tables (templates/SpecparamTogether.ipynb, run once after all subjects).
# A subject is marked "Exclude" if fewer than min_good_channel_fraction of its
# channels have a specparam fit with R^2 of at least min_r_squared.
min_r_squared             = 0.9
min_good_channel_fraction = 0.5
# The report also lists each subject's median fit error and its robust z-score
# against the run (specparam_error_median, specparam_error_z). They are shown
# only, not used for Keep/Exclude: R^2 rises with the exponent, the error does not.
