[paths]
project_root = "/Users/daniel/PhD/Projects/psd-paths"
# Path to BIDS-formatted data (where load_data looks for EEG files)
bids_root = "data/bids"  # Relative to project_root

path_raw_bids = "/Users/daniel/PhD/Projects/psd-path/data/bids/"

# Where analysis output goes. Sits next to bids/ inside data/ by default.
# To test a pipeline variant side by side, change ONLY this line, e.g.
#   derivatives_root = "data/derrivatives_avgref"
# every stage below follows automatically, and the existing run is untouched.
derivatives_root = "data/derrivatives"
outputs_root     = "outputs"

# Derivative layout. Templates may use {derivatives}, {outputs} and {subject}
# ({subject} expands to e.g. "sub-105").
# Stage-first (stage/subject) groups every subject of one stage together, so a
# single stage folder can be handed to a collaborator on its own.
# Omit a key to keep its default (subject-first: {derivatives}/{subject}/<stage>).
[paths.stages]
preprocessed = "{derivatives}/processed/{subject}"
epochs       = "{derivatives}/epochs/{subject}"
analysis     = "{derivatives}/analysis/{subject}"
ica          = "{derivatives}/ica/{subject}"
figures      = "{outputs}/figures/{subject}"
reports      = "{outputs}/reports/{subject}"
specparam    = "{outputs}/specparam/{subject}"

[pipeline]
# Runner bookkeeping: executed notebooks, run logs, per-step status.
# NOT the analysis data -- that is [paths.stages] above.
# {outputs} follows outputs_root, so changing that one line moves these too.
output_root = "{outputs}/pipeline"
output_log =  "{outputs}/log"
status_file = "{outputs}/pipeline_status.json"

# Parallelism and Jupyter kernel
n_jobs = 8
kernel_name = "psd-paths-3.13"

[experiment]
# Add any experiment-specific settings here
task = "rest" # or whatever your task is
session = "01"      # BIDS ses-XX level; all 38 subjects use ses-01



[preprocessing]
montage = "GSN-HydroCel-256"

# Bad-channel detection. pyprep/RANSAC predicts each channel from its spatial
# neighbours, so a contiguous patch of failed electrodes predicts itself and is
# missed (this is why sub-109's E221-E223 cluster went undetected). LOF scores
# channels in activity space instead and has no such blind spot.
# Kumaravel et al. 2022, Sensors 22:7314, doi:10.3390/s22197314
use_lof         = true
lof_n_neighbors = 20
# Conservative. MNE default is 1.5, which flags a median of 11 extra channels
# per subject here (max 47) -- far too aggressive. At 4.0 the median is +1
# (20/38 subjects affected, max +7), while the sub-109 cluster that motivated
# this scores 10-26 and is still caught with a wide margin.
lof_threshold   = 4.0
flat_uv         = 1.0    # channels below this std are flat (LOF cannot see them)   # required by pyprep RANSAC (needs channel positions)
channels_to_remove = [
    "E67",
    "E73",
    "E82",
    "E91",
    "E92",
    "E102",
    "E111",
    "E120",
    "E133",
